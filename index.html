<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Little League</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231e3a8a'/%3E%3Cpath d='M16 5 L26 25 L6 25 Z' fill='%23fbbf24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/client/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="setup" class="screen"></div>
    <div id="hud" hidden>
      <div id="topbar">
        <div class="score blue"><span class="label">BLUE</span><span id="scoreBlue">0</span></div>
        <div id="clock">0:00</div>
        <div class="score red"><span id="scoreRed">0</span><span class="label">RED</span></div>
        <div id="objectives"></div>
      </div>
      <div id="killfeed"></div>
      <div id="announce"></div>
      <div id="notice"></div>
      <div id="bottom">
        <div id="portrait">
          <canvas id="portraitCanvas" width="72" height="72"></canvas>
          <div id="levelBadge">1</div>
        </div>
        <div id="center">
          <div id="buffbar"></div>
          <div id="bars">
            <div class="bar hp"><div class="fill"></div><div class="shield"></div><span class="text"></span></div>
            <div class="bar mana"><div class="fill"></div><span class="text"></span></div>
          </div>
          <div id="abilities"></div>
          <div id="xpbar"><div class="fill"></div><span class="text"></span></div>
        </div>
        <div id="inventory">
          <div id="items"></div>
          <div id="goldrow"><span id="gold">0</span><button id="shopBtn" title="Open shop (P)">Shop</button></div>
        </div>
        <div id="stats"></div>
      </div>
      <canvas id="minimap" width="220" height="220"></canvas>
      <div id="hint"></div>
      <div id="scoreboard" class="modal" hidden></div>
      <div id="shop" class="modal" hidden></div>
      <div id="death" hidden></div>
      <div id="pause" class="modal" hidden></div>
      <div id="tooltip" hidden></div>
      <div id="end" class="modal" hidden></div>
    </div>
  </div>
  <script type="module" src="src/client/main.js"></script>
</body>
</html>
